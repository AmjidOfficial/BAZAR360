name: Bazar360 Production Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - owner/10-10-production-hardening

jobs:
  production-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Audit production marketplace data
        run: npm run audit:data

      - name: Production build
        run: npm run build

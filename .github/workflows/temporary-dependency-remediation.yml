name: Temporary compatible dependency remediation

on:
  push:
    branches:
      - fix/vehicle-sales-crm-data

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/vehicle-sales-crm-data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Pin the audited gh-pages release
        run: npm install --save-dev --save-exact gh-pages@6.1.1

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency changes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate compatible npm dependency advisories"
          git push origin HEAD:fix/vehicle-sales-crm-data

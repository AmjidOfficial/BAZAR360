name: Audit Live Firestore Inventory

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Remove Confirmed Fake Inventory"]
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit live Firestore inventory
        env:
          FIREBASE_SERVICE_ACCOUNT_BAZAR360: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAZAR360 }}
        run: node scripts/audit-live-firestore-inventory.mjs

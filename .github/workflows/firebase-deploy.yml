name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore App shell only when the source is truncated
        run: |
          set -e
          APP_SIZE=$(wc -c < src/App.tsx)
          if [ "$APP_SIZE" -lt 100000 ]; then
            echo "App.tsx is unexpectedly small (${APP_SIZE} bytes). Restoring the last known-good App shell."
            git fetch --no-tags origin 58a8dda3b39d39dc8f7276cf16dc258e871b3121
            git checkout 58a8dda3b39d39dc8f7276cf16dc258e871b3121 -- src/App.tsx
            python - <<'PY'
            from pathlib import Path
            p = Path('src/App.tsx')
            s = p.read_text()
            marker = "import AdminShowroomCreator from './components/AdminShowroomCreator';"
            if "ShowroomOwnerPortal" not in s:
                s = s.replace(marker, marker + "\nimport ShowroomOwnerPortal from './components/ShowroomOwnerPortal';")
            route = '<Route path="/portal" element={<App />} />'
            owner_route = route + '\n            <Route path="/owner" element={<ShowroomOwnerPortal />} />\n            <Route path="/showroom-owner" element={<ShowroomOwnerPortal />} />'
            if '<Route path="/owner"' not in s:
                s = s.replace(route, owner_route)
            p.write_text(s)
            PY
            git add src/App.tsx
            if ! git diff --cached --quiet; then
              git config user.name "BAZAR360 Automation"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "fix: restore App after accidental truncation [skip ci]"
              git push origin HEAD:main
            else
              echo "Restored App content already matches main; no source commit required."
            fi
          else
            echo "App.tsx size ${APP_SIZE} bytes. Source looks healthy; no restore needed."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify Firebase deployment configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAZAR360 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Missing FIREBASE_SERVICE_ACCOUNT_BAZAR360 repository secret"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy Firestore security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project bazar360-2026 --non-interactive

      - name: Recover historical Auto Choice Peshawar showroom
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAZAR360 }}
        run: node scripts/recover-auto-choice-showroom.mjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAZAR360 }}
          channelId: live
          projectId: bazar360-2026

name: Recover Live User/Admin Inventory

on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: 'Type RECOVER to write only verified owner-matched records into listings'
        required: true
        default: 'DRY-RUN'
      dry_run:
        description: 'Use true for discovery only; false performs safe idempotent recovery'
        required: true
        default: 'true'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live inventory recovery audit
        if: ${{ inputs.dry_run == 'true' || inputs.confirm_recovery == 'RECOVER' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAZAR360 }}
          RECOVERY_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/recover-live-inventory.mjs
      - name: Refuse unsafe execution
        if: ${{ inputs.dry_run == 'false' && inputs.confirm_recovery != 'RECOVER' }}
        run: |
          echo 'Recovery requires confirm_recovery=RECOVER.'
          exit 1
